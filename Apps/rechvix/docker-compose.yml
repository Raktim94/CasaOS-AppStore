name: rechvix

services:
  # billing_app's role-creation SQL used to be generated by a SEPARATE
  # postgres-init container (CasaOS has no repo access to bind-mount a
  # real init script, so one had to be generated on first boot) that
  # postgres depended on via `condition: service_completed_successfully`.
  # That shape has caused two distinct real install-breaking bugs now:
  # v0.2.1 fixed a shell-escaping bug that gave billing_app a garbage
  # password; this fix removes the whole second container, because on a
  # genuinely fresh install (empty volumes) postgres itself would
  # reliably get stuck in "Created" — never started at all — while
  # postgres-init crash-looped, a dependency-ordering failure in
  # whatever compose engine CasaOS's install path uses, not something
  # fixable from this file's `depends_on`/`restart` fields alone
  # (confirmed by reproducing it twice against a live install and by a
  # clean local `docker compose up` test of this single-container
  # replacement). postgres now writes its own role-creation script into
  # /docker-entrypoint-initdb.d via its own command, immediately before
  # exec'ing the real postgres entrypoint — no second container, no
  # depends_on, no ordering to get wrong. Password interpolation is
  # unchanged from postgres-init's own (already-correct) approach: plain
  # ${BILLING_APP_PASSWORD} compose interpolation into a single-quoted
  # heredoc (<<'SQL'), so neither compose nor the shell has any `$` left
  # to mangle.
  postgres:
    image: postgres:18
    container_name: rechvix-postgres
    hostname: rechvix-postgres
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        umask 022
        mkdir -p /docker-entrypoint-initdb.d
        cat > /docker-entrypoint-initdb.d/01-create-runtime-role.sql <<'SQL'
        SELECT 'CREATE ROLE billing_app LOGIN PASSWORD ''${BILLING_APP_PASSWORD}'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'billing_app')
        \gexec
        SQL
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_migrator
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      BILLING_APP_PASSWORD: "${BILLING_APP_PASSWORD}"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_migrator -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rechvix
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            en_US: Database password for the schema-owning role (migrations only — the app never connects as this role). Set a strong random value.
        - container: BILLING_APP_PASSWORD
          description:
            en_US: Database password for the application's runtime role. Set a strong random value, different from POSTGRES_PASSWORD.
      volumes:
        - container: /var/lib/postgresql
          description:
            en_US: All business data — invoices, inventory, accounting, everything. Back this up.

  migrate:
    image: ghcr.io/raktim94/rechvix-server:0.12.0
    container_name: rechvix-migrate
    command: ["-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DSN: "postgres://billing_migrator:${POSTGRES_PASSWORD}@rechvix-postgres:5432/billing?sslmode=disable"
    networks:
      - rechvix
    x-casaos:
      envs: []

  app:
    image: ghcr.io/raktim94/rechvix-server:0.12.0
    container_name: rechvix-app
    hostname: rechvix-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "8080"
      DATABASE_DSN: "postgres://billing_app:${BILLING_APP_PASSWORD}@rechvix-postgres:5432/billing?sslmode=disable"
      DATABASE_AUTO_MIGRATE: "false"
      BACKUP_DATABASE_DSN: "postgres://billing_migrator:${POSTGRES_PASSWORD}@rechvix-postgres:5432/billing?sslmode=disable"
      SESSION_COOKIE_SECURE: "false"
      AEAD_ENCRYPTION_KEY: "${AEAD_ENCRYPTION_KEY}"
      ENABLE_BOOTSTRAP: "true"
    ports:
      - target: 8080
        published: "8090"
        protocol: tcp
    networks:
      - rechvix
    x-casaos:
      envs:
        - container: AEAD_ENCRYPTION_KEY
          description:
            en_US: Encrypts stored integration credentials. Generate with `openssl rand -base64 32` and keep it safe — losing it makes those values unrecoverable.
      ports:
        - container: "8080"
          description:
            en_US: rechvix API
          protocol: tcp

  worker:
    image: ghcr.io/raktim94/rechvix-worker:0.12.0
    container_name: rechvix-worker
    hostname: rechvix-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_DSN: "postgres://billing_app:${BILLING_APP_PASSWORD}@rechvix-postgres:5432/billing?sslmode=disable"
      AEAD_ENCRYPTION_KEY: "${AEAD_ENCRYPTION_KEY}"
      EINVOICE_PROVIDER: "mock"
    networks:
      - rechvix
    x-casaos:
      envs: []

networks:
  rechvix:
    driver: bridge

x-casaos:
  id: com.nodedr.rechvix
  architectures:
    - amd64
    - arm64
  main: app
  author: NodeDR Infotech Private Limited
  developer: Raktim94
  category: Finance
  icon: "https://cdn.jsdelivr.net/gh/Raktim94/CasaOS-AppStore@main/Apps/rechvix/icon.png"
  thumbnail: "https://cdn.jsdelivr.net/gh/Raktim94/CasaOS-AppStore@main/Apps/rechvix/thumbnail.png"
  screenshot_link:
    - "https://cdn.jsdelivr.net/gh/Raktim94/CasaOS-AppStore@main/Apps/rechvix/screenshot-1.png"
    - "https://cdn.jsdelivr.net/gh/Raktim94/CasaOS-AppStore@main/Apps/rechvix/screenshot-2.png"
    - "https://cdn.jsdelivr.net/gh/Raktim94/CasaOS-AppStore@main/Apps/rechvix/screenshot-3.png"
  title:
    en_US: rechvix
  tagline:
    en_US: Self-hosted billing, inventory, accounting, and India GST — no subscription, no external connection required
  description:
    en_US: |
      A production-grade, multi-company, multi-branch, multi-warehouse
      billing, inventory, accounting, and tax-management platform.
      India GST / e-Invoice / e-Way Bill capable, self-hosted on your own
      hardware — no subscription, no mandatory cloud dependency, no data
      leaving your server for core operation.

      Double-entry accounting, perpetual multi-warehouse inventory, GST
      invoicing with CGST/SGST/IGST breakdown, and a free e-Way Bill
      workflow that never requires a paid government API. AGPL-3.0
      licensed, same as this project's sibling, nodedr-pos.

      Ships with a full web UI (dashboard, sales, purchases, inventory,
      contacts, accounting, GST/tax, reports, settings) — apps/server
      serves it directly, no separate frontend container needed.
  tips:
    before_install:
      en_US: |
        Set POSTGRES_PASSWORD, BILLING_APP_PASSWORD (two different strong
        passwords), and AEAD_ENCRYPTION_KEY (`openssl rand -base64 32`)
        before installing.

        Your data persists at `/DATA/AppData/rechvix/postgres`,
        following CasaOS/ZimaOS's standard backup/restore convention.

        First run: open the app and go to /setup to create your business
        (organisation, first branch/warehouse, and owner login).
  index: /
  scheme: http
  port_map: "8090"
  version: "0.13.0"
  update_at: "2026-09-08"
  release_notes:
    en_US: |-
      0.13.0 (2026-09-08):
      Fixed a real fresh-install bug: on a brand-new install, Postgres
      could get stuck and never start at all, leaving the app looking
      broken/unresponsive. The separate one-time setup container that
      used to run before Postgres is gone — Postgres now does that one
      step itself, removing the ordering problem entirely. No change
      for an existing, already-running install.

      0.12.0 (2026-09-08):
      Added a GSTR-3B summary on the GST page — outward tax liability
      and input tax credit, computed from your finalized sales and
      purchases (a preparation aid, like GSTR-1, not a filing
      submission).

      0.11.0 (2026-09-08):
      Purchases now compute real GST — a supplier bill correctly splits
      into taxable value and input tax credit (CGST/SGST or IGST,
      depending on the supplier's state) when the supplier has a GST
      registration on file, instead of the whole amount posting as one
      lump sum. Groundwork for a full GSTR-3B report, coming next.

      0.10.0 (2026-09-08):
      Settings now has a Branches & warehouses panel — a business
      running more than one location or stock point can see and add
      them directly, instead of the app only ever knowing about one of
      each.

      0.9.0 (2026-09-08):
      A tax invoice's e-Invoice status (IRN, ack number, or why it
      failed) is now visible right on the invoice screen — generation
      itself has always been automatic, this just makes the result
      visible instead of only checkable via the database.

      0.8.0 (2026-09-08):
      Cancel/void now works on the purchases side too, mirroring the
      invoice-cancellation added in 0.7.0 — a mis-entered goods receipt,
      bill, return, or debit note can be voided, with stock and the
      supplier ledger reversed exactly.

      0.7.0 (2026-09-08):
      A mis-billed finalized invoice can now be cancelled/voided outright
      — stock is put back and the sale is reversed out of the books with
      its own ledger entry, rather than the only option being a return
      or credit note (which imply the customer is actually giving
      something back). Added month/year-end close (fiscal period lock)
      so closed periods can't be posted into by accident, and the
      Reports page now shows trial balance, receivables/payables ageing,
      and purchase document drilldowns.

      0.6.0 (2026-09-08):
      Added sales returns and credit notes — a customer returning an
      item, or a price correction after the fact, now has a real path,
      with partial-quantity returns handled correctly (only the returned
      units go back into stock). Receipts and payments can now be tied
      to a real bank account instead of always silently posting to cash
      regardless of the payment method picked. A WhatsApp share link can
      now actually be revoked, not just claimed to be.

      0.5.0 (2026-09-08):
      Scanning a barcode at the counter now actually finds the product —
      the billing screen has always said "scan a barcode" but the search
      behind it only ever matched product names, so a scan silently
      found nothing; fixed, and a barcode can now be attached right on
      the product form. A finalized invoice/bill now shows what's
      actually been paid against it and lets you record a payment there
      directly, instead of only ever seeing a customer's total on-account
      balance. New product creation can set opening stock in the same
      step, instead of failing on the first sale with no clue why. Added
      a change-password screen. A few pages (Inventory, Accounting) that
      had no visible way to create anything now do, and the calendar
      picked up a Google-Calendar-style quick task composer.

      0.4.0 (2026-09-08):
      Scan a distributor's purchase bill with your camera and let OCR fill
      in the purchase for you — it matches the distributor against your
      existing suppliers (by GSTIN or name) so you don't end up with
      duplicates, matches each line to a catalogue product, and lets you
      correct every field (including a negotiated price) before anything
      is saved. Stock received at a new price now opens its own cost
      batch instead of being blended away, so margins stay honest.

      Also new: day-to-day expense tracking (rent, electricity, wages),
      staff attendance with a calendar that also holds your dated tasks,
      a "Today" summary on the dashboard, a choice of five invoice
      layouts when printing, quick-add for customers and distributors
      without leaving the billing screen, WhatsApp sharing straight from
      the sales list, a show/hide toggle on password fields, and a
      Ctrl+K command palette. The whole interface has been reworked for
      counter use.

      0.3.1 (2026-09-07):
      Fixed two real bugs found while testing 0.3.0 live: the Unit
      dropdown on the new-product form was always empty (frontend/backend
      field-name mismatch), which made it impossible to ever pick a
      previously-created unit and forced creating a new throwaway one
      every time; and the Category/Brand "add new" inputs overlapped
      illegibly with each other on the same form.

      0.3.0 (2026-09-07):
      Ships 15 commits of features that had been merged to the source
      repo but never actually released: a real per-product inventory
      view (stock, movement history, manual adjustments — not just two
      report tables), catalogue category/brand selection, a full
      contact detail page (GSTIN, address, ledger, record payment),
      CSV/Excel import for products and contacts, global keyboard
      shortcuts, invoice branding and WhatsApp sharing, encrypted
      backup/restore, and search/filtering on the sales and purchases
      lists.

      0.2.2 (2026-09-07):
      Sign-in page now shows a persistent "New to Rechvix? Set up your
      business" link when first-run setup is still open, instead of
      silently redirecting a fresh install away from the login form.

      0.2.1 (2026-09-07):
      Fixed a real install-breaking bug: postgres-init generated the
      billing_app database role with a garbage password (a shell escaping
      bug, not just a CasaOS quirk), so the app and worker containers
      crash-looped on every fresh install. Also fixed the icon/screenshot
      links, which pointed at an unmerged upstream path and 404ed.

      0.2.0 (2026-09-06):
      Owner/Admin can now add teammates from Settings > Team — Bootstrap
      previously only ever created the single first-run owner, with no way
      to give anyone else at the business their own login. Also wires up
      forgot-password screens for the reset flow the backend already
      supported, and replaces the placeholder icon with the real Rechvix
      logo. Full history:
      https://github.com/Raktim94/rechvix/blob/main/CHANGELOG.md

      0.1.0 (2026-09-05):
      Initial CasaOS/ZimaOS release: self-hosted billing, inventory,
      accounting, and India GST/e-Invoice/e-Way Bill platform. Double-entry
      accounting, multi-company/branch/warehouse support, and a full web UI
      served directly by the app container — no separate frontend needed.
  website: "https://www.nodedr.com"
  repo: "https://github.com/Raktim94/rechvix"
  support: "https://github.com/Raktim94/rechvix/issues"
  docs: "https://github.com/Raktim94/rechvix#readme"
